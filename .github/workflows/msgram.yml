name: msg

on:
  workflow_run:
    workflows: ["Rodar Testes"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  build:
    # Só publica métricas quando os testes passaram.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: msg
        uses: fga-eps-mds/MeasureSoftGram-Action@2.1.5
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          msgramServiceToken: ${{ secrets.MSGRAMPLUGINTOKEN }}
          productName: "Measure"
          workflowName: 'Rodar Testes'
          collectSonarqubeMetrics: true
          collectGithubMetrics: true
          usLabel: "US"
